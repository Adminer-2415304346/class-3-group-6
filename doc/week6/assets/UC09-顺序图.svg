<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2342" viewBox="0 0 2200 2342"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="28" font-size="39" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="700">UC09 第三方登录与邮箱绑定顺序图</text><text x="62" y="86" font-size="23" fill="#61738A" dominant-baseline="text-before-edge" font-weight="400">分析级交互：消息名称表达职责；条件与异常见对应的用例说明。</text><rect x="15.0" y="145" width="330" height="195" fill="#FFFFFF" stroke="#245E91" stroke-width="3"/><text x="123.0" y="202.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">«actor»</text><text x="68.0" y="242.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">第三方账号用户</text><polyline points="180.0,340 180.0,2262" fill="none" stroke="#A4B2C3" stroke-width="2" stroke-dasharray="10 8"/><rect x="475.0" y="145" width="330" height="195" fill="#E9F1FC" stroke="#245E91" stroke-width="3"/><text x="548.4921875" y="202.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">«boundary»</text><text x="544.0" y="242.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">登录绑定界面</text><polyline points="640.0,340 640.0,2262" fill="none" stroke="#A4B2C3" stroke-width="2" stroke-dasharray="10 8"/><rect x="935.0" y="145" width="330" height="195" fill="#F2F1F9" stroke="#245E91" stroke-width="3"/><text x="1027.5" y="202.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">«control»</text><text x="953.5" y="242.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">OAuth视图及管理器</text><polyline points="1100.0,340 1100.0,2262" fill="none" stroke="#A4B2C3" stroke-width="2" stroke-dasharray="10 8"/><rect x="1395.0" y="145" width="330" height="195" fill="#FFF4E6" stroke="#245E91" stroke-width="3"/><text x="1480.5" y="202.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">«external»</text><text x="1461.5" y="242.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">OAuth提供方</text><polyline points="1560.0,340 1560.0,2262" fill="none" stroke="#A4B2C3" stroke-width="2" stroke-dasharray="10 8"/><rect x="1855.0" y="145" width="330" height="195" fill="#EAF4EE" stroke="#245E91" stroke-width="3"/><text x="1958.0" y="202.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">«entity»</text><text x="1876.0" y="242.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">外部身份及本站用户</text><polyline points="2020.0,340 2020.0,2262" fill="none" stroke="#A4B2C3" stroke-width="2" stroke-dasharray="10 8"/><polyline points="180.0,440 640.0,440" fill="none" stroke="#1D2E47" stroke-width="3"/><polyline points="625.5928463623571,446.9594485457797 640.0,440 625.5928463623571,433.0405514542203" fill="none" stroke="#1D2E47" stroke-width="3"/><rect x="275.0" y="392" width="270.0" height="45" fill="white"/><text x="280.0" y="395" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">1. 选择第三方登录</text><rect x="634.0" y="440" width="12" height="33" fill="white" stroke="#245E91" stroke-width="3"/><text x="640.0" y="447.5" font-size="10" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400"></text><polyline points="640.0,568 1100.0,568" fill="none" stroke="#1D2E47" stroke-width="3"/><polyline points="1085.5928463623572,574.9594485457797 1100.0,568 1085.5928463623572,561.0405514542203" fill="none" stroke="#1D2E47" stroke-width="3"/><rect x="702.5" y="520" width="335.0" height="45" fill="white"/><text x="707.5" y="523" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">2. GET type及next_url</text><rect x="1094.0" y="568" width="12" height="33" fill="white" stroke="#245E91" stroke-width="3"/><text x="1100.0" y="575.5" font-size="10" f