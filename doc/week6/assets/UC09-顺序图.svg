,1080 194.40715363764284,1086.9594485457797" fill="none" stroke="#61738A" stroke-width="3"/><rect x="751.0" y="1032" width="238.0" height="45" fill="white"/><text x="756.0" y="1035" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">6. 请求身份授权</text><polyline points="1560.0,1208 1100.0,1208" fill="none" stroke="#1D2E47" stroke-width="3"/><polyline points="1114.4071536376428,1201.0405514542203 1100.0,1208 1114.4071536376428,1214.9594485457797" fill="none" stroke="#1D2E47" stroke-width="3"/><rect x="1190.0" y="1160" width="280.0" height="45" fill="white"/><text x="1195.0" y="1163" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">7. 浏览器回调code</text><rect x="1094.0" y="1208" width="12" height="33" fill="white" stroke="#245E91" stroke-width="3"/><text x="1100.0" y="1215.5" font-size="10" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400"></text><polyline points="1100.0,1336 1560.0,1336" fill="none" stroke="#1D2E47" stroke-width="3"/><polyline points="1545.5928463623572,1342.9594485457797 1560.0,1336 1545.5928463623572,1329.0405514542203" fill="none" stroke="#1D2E47" stroke-width="3"/><rect x="1151.5078125" y="1288" width="356.984375" height="45" fill="white"/><text x="1156.5078125" y="1291" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">8. 换token并取用户资料</text><rect x="1554.0" y="1336" width="12" height="33" fill="white" stroke="#245E91" stroke-width="3"/><text x="1560.0" y="1343.5" font-size="10" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400"></text><polyline points="1560.0,1464 1100.0,1464" fill="none" stroke="#61738A" stroke-width="3" stroke-dasharray="10 8"/><polyline points="1114.4071536376428,1457.0405514542203 1100.0,1464 1114.4071536376428,1470.9594485457797" fill="none" stroke="#61738A" stroke-width="3"/><rect x="1179.0" y="1416" width="302.0" height="45" fill="white"/><text x="1184.0" y="1419" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">9. 返回含邮箱的身份</text><polyline points="1100.0,1592 2020.0,1592" fill="none" stroke="#1D2E47" stroke-width="3"/><polyline points="2005.5928463623572,1598.9594485457797 2020.0,1592 2005.5928463623572,1585.0405514542203" fill="none" stroke="#1D2E47" stroke-width="3"/><rect x="1383.5" y="1544" width="353.0" height="45" fill="white"/><text x="1388.5" y="1547" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">10. 查建身份并关联用户</text><rect x="2014.0" y="1592" width="12" height="33" fill="white" stroke="#245E91" stroke-width="3"/><text x="2020.0" y="1599.5" font-size="10" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400"></text><polyline points="2020.0,1720 1100.0,1720" fill="none" stroke="#61738A" stroke-width="3" stroke-dasharray="10 8"/><polyline points="1114.4071536376428,1713.0405514542203 1100.0,1720 1114.4071536376428,1726.9594485457797" fill="none" stroke="#61738A" stroke-width="3"/><rect x="1399.5" y="1672" width="321.0" height="45" fill="white"/><text x="1404.5" y="1675" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">11. 返回本地用户关联</text><polyline points="1100.0,1848 1270.0,1848 1270.0,1880 1100.0,1880" fill="none" stroke="#1D2E47" stroke-width="3"/><polyline points="1114.4071536376428,1873.0405514542203 1100.0,1880 1114.4071536376428,1886.9594485457797" fill="none" stroke="#1D2E47" stroke-width="3"/><rect x="1113.0" y="1765" width="353.0" height="45" fill="white"/><text x="1118.0" y="1768" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">12. 发登录信号并建会话</text><rect x="1094.0" y="1848" width="12" height="33" fill="white" stroke="#245E91" stroke-width="3"/><text x="1100.0" y="1855.5" font-size="10" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400"></text><polyline points="1100.0,1976 640.0,1976" fill="none" stroke="#61738A" stroke-width="3" stroke-dasharray="10 8"/><polyline points="654.4071536376429,1969.0405514542203 640.0,1976 654.4071536376429,1982.9594485457797" fill="none" stroke="#61738A" stroke-width="3"/><rect x="689.0" y="1928" width="362.0" height="45" fill="white"/><text x="694.0" y="1931" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">13. 写Cookie并安全跳转</text><polyline points="640.0,2104 180.0,2104" fill="none" stroke="#61738A" stroke-width="3" stroke-dasharray="10 8"/><polyline points="194.40715363764284,2097.0405514542203 180.0,2104 194.40715363764284,2110.9594485457797" fill="none" stroke="#61738A" stroke-width="3"/><rect x="265.5" y="2056" width="289.0" height="45" fill="white"/><text x="270.5" y="2059" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">14. 展示已登录页面</text><text x="60" y="2290" font-size="23" fill="#61738A" dominant-baseline="text-before-edge" font-weight="400">实线：调用/操作    虚线：返回    细条：执行    时间自上而下；图中条件、外部送达与现存缺陷见对应说明。</text></g></svg>
