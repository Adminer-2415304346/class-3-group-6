idth="3"/><rect x="235.5" y="2284" width="257.0" height="45" fill="white"/><text x="240.5" y="2287" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">15. 提示可以登录</text><text x="60" y="2518" font-size="23" fill="#61738A" dominant-baseline="text-before-edge" font-weight="400">实线：调用/操作    虚线：返回    细条：执行    时间自上而下；图中条件、外部送达与现存缺陷见对应说明。</text></g></svg>
