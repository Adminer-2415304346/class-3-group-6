<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2086" viewBox="0 0 2200 2086"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="60" y="28" font-size="39" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="700">UC05 登录与退出顺序图</text><text x="62" y="86" font-size="23" fill="#61738A" dominant-baseline="text-before-edge" font-weight="400">分析级交互：消息名称表达职责；条件与异常见对应的用例说明。</text><rect x="15.0" y="145" width="330" height="195" fill="#FFFFFF" stroke="#245E91" stroke-width="3"/><text x="123.0" y="202.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">«actor»</text><text x="116.0" y="242.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">本站用户</text><polyline points="180.0,340 180.0,2006" fill="none" stroke="#A4B2C3" stroke-width="2" stroke-dasharray="10 8"/><rect x="475.0" y="145" width="330" height="195" fill="#E9F1FC" stroke="#245E91" stroke-width="3"/><text x="548.4921875" y="202.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">«boundary»</text><text x="528.0" y="242.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">登录及导航界面</text><polyline points="640.0,340 640.0,2006" fill="none" stroke="#A4B2C3" stroke-width="2" stroke-dasharray="10 8"/><rect x="935.0" y="145" width="330" height="195" fill="#F2F1F9" stroke="#245E91" stroke-width="3"/><text x="1027.5" y="202.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">«control»</text><text x="1004.0" y="242.5" font-size="32" fill="#1D2E47" dominant-baseline="text-before-edge" font-weight="400">登录退出视图</text><polyline points="1100.0,340 1100.0,2006" fill="none" stroke="#A4B2C3" stroke-width="2" stroke-dasharray="10 8"/><rect x="1395.0" y="145" width="330" height="195" fill="#F2F1F9" stroke="#245E91" stroke-width="3"/><text x="1487.5" y="202.5" font-size="32" fill="#1D2E47" domi